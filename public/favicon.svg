<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38D996" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield outline -->
  <path d="M50 8 L85 24 V52 C85 72 50 92 50 92 C50 92 15 72 15 52 V24 L50 8 Z" 
        fill="#0A1020" stroke="url(#neonGlow)" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- Circuit Nodes & Traces inside Shield -->
  <circle cx="50" cy="38" r="5" fill="#00E5FF" />
  <circle cx="35" cy="54" r="3.5" fill="#38D996" />
  <circle cx="65" cy="54" r="3.5" fill="#38D996" />
  <circle cx="50" cy="68" r="4" fill="#8B5CF6" />

  <path d="M50 38 L35 54 M50 38 L65 54 M35 54 L50 68 M65 54 L50 68 M50 20 L50 33" 
        stroke="#00E5FF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="50" cy="20" r="2.5" fill="#00E5FF" />
</svg>